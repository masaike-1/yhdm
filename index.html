.petals{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.petal{
  position:absolute;top:-36px;left:var(--x);
  width:var(--sz);height:var(--sz);opacity:var(--o);
  animation:fall var(--d) linear var(--dl) infinite;
  will-change:transform;
}
.petal svg{display:block;width:100%;height:100%;fill:var(--c);animation:spin calc(var(--d)*.9) ease-in-out infinite alternate}
@keyframes fall{
  from{transform:translate3d(0,-4vh,0)}
  to{transform:translate3d(var(--sway),112vh,0)}
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(230deg)}
}

        '--c:' + colors[i % colors.length],
        '--d:' + (9 + Math.random()*10).toFixed(1) + 's',
        '--dl:' + (-Math.random()*16).toFixed(1) + 's'
      ].join(';');
      p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2c2 5.2 5.2 8.2 10 8.6-4.8.4-8 3.4-10 8.6-2-5.2-5.2-8.2-10-8.6 4.8-.4 8-3.4 10-8.6z"/></svg>';
      frag.appendChild(p);
    }
    holder.appendChild(frag);
  }

  /* Toast */
  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 3200);
  }

  /* 邮箱预约提醒 */
  var form = document.querySelector('.subscribe');
  var input = form.querySelector('input');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var val = input.value.trim();
    var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val);
    if(!ok){
      input.focus();
      showToast('请输入有效的邮箱地址');
      return;
    }
    try{
      var list = JSON.parse(localStorage.getItem('sakura_waitlist') || '[]');
      if(list.indexOf(val) === -1){
        list.push(val);
        localStorage.setItem('sakura_waitlist', JSON.stringify(list));
      }
    }catch(err){}
    input.value = '';
    showToast('已登记，iOS 上线第一时间通知您');
  });

  /* 进入页面自动播放音乐：先尝试自动播放，被浏览器拦截时轻触任意处即开 */
  var bgm = document.getElementById('bgm');
  var bgmUnlockArmed = false;
  function playBgm(){
    if(bgm.paused){
      var p = bgm.play();
      if(p && p.catch){ p.catch(function(){}); }
    }
  }
  playBgm();
  setTimeout(function(){
    if(bgm.paused){
      bgmUnlockArmed = true;
      showToast('浏览器拦截了自动播放，轻触页面任意位置即可开启音乐');
    }
  }, 800);
  function unlockBgmOnce(){
    if(!bgmUnlockArmed){ return; }
    bgmUnlockArmed = false;
    playBgm();
    window.removeEventListener('pointerdown', unlockBgmOnce);
    window.removeEventListener('touchstart', unlockBgmOnce);
    window.removeEventListener('keydown', unlockBgmOnce);
  }
  window.addEventListener('pointerdown', unlockBgmOnce);
  window.addEventListener('touchstart', unlockBgmOnce);
  window.addEventListener('keydown', unlockBgmOnce);
})();
</script>
</body>
